# Rebuilds assets/questions.js whenever the question spreadsheet changes,
# so updating the quiz only needs a new data/questions.xlsx upload.
name: Update questions

on:
  push:
    paths:
      - data/questions.xlsx
      - scripts/build_questions.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-questions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Convert spreadsheet
        run: |
          pip install openpyxl
          python scripts/build_questions.py

      - name: Commit updated questions
        run: |
          if git diff --quiet -- assets/questions.js; then
            echo "questions.js already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add assets/questions.js
          git commit -m "Update questions from spreadsheet"
          git push origin "HEAD:${GITHUB_REF_NAME}"
